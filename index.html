<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Tour</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0ea5e9">

<script>
  (function() {
    var dir = location.pathname.replace(/[^/]*$/, '');
    window.appBase = dir.endsWith('/poi/') ? dir.slice(0, -4) : dir;
    var base = document.createElement('base');
    base.href = window.appBase;
    document.head.appendChild(base);
  })();

  // --- Inject CSS dynamically ---
  const cssFiles = [
    "style.css",
    "vendor/leaflet.css",
    "vendor/MarkerCluster.css",
    "vendor/MarkerCluster.Default.css"
  ];
  cssFiles.forEach(href => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = href.startsWith("http") ? href : new URL(href, window.location.origin + window.appBase).href;
    document.head.appendChild(link);
  });

  // --- Register service worker ---
  if ("serviceWorker" in navigator) {
    const swUrl = new URL("service-worker.js", window.location.origin + window.appBase).href;
    navigator.serviceWorker.register(swUrl)
      .then(() => console.log("✅ Service Worker registered at", swUrl))
      .catch(err => console.error("Service Worker failed:", err));
  }
</script>

</head>
<body class="main-page">

<header class="appbar">
  <h1>a Field Guide to Quinta Vale da Lama</h1>
  <div class="controls">
    <button data-range="today" class="active">Today</button>
    <button data-range="week">This Week</button>
    <button data-range="all">All</button>
  </div>
  <div class="gamification">
    <span id="points">0 pts</span>
    <span id="badges"></span>
    <button id="settingsBtn" aria-label="Open settings">⚙️</button>
  </div>
</header>

<div id="map" role="region" aria-label="Observation map" style="height: 70vh;"></div>

<section id="observations" aria-live="polite">Loading...</section>

<footer class="footer">
  <a href="qr_admin.html" id="qr-admin-link">QR Admin</a>
  <span class="footer-sep"> :: </span>
  <a href="https://www.inaturalist.org/projects/197410" target="_blank" rel="noopener noreferrer">
    View Project at iNaturalist
  </a>
</footer>

<div id="settingsOverlay" class="modal-overlay hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-header">
      <h2 id="settingsTitle">Settings</h2>
      <button id="settingsClose" class="modal-close" aria-label="Close settings">&times;</button>
    </div>

    <div class="settings-row">
      <label for="settingDefaultRange">Default time range</label>
      <select id="settingDefaultRange">
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="all">All</option>
      </select>
    </div>

    <div class="settings-row">
      <button id="settingsInstall" class="hidden">Install app</button>
    </div>

    <p id="settingsInstallIOS" class="settings-hint hidden">
      To install: tap the Share icon
      <span aria-hidden="true">&#x2191;</span>
      in Safari, then <strong>Add to Home Screen</strong>.
    </p>

    <div class="settings-row">
      <button id="settingsClearData" class="danger">Clear local data (notes &amp; trip plan)</button>
    </div>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="vendor/leaflet-omnivore.min.js"></script>
<script src="escape.js"></script>
<script src="app.js?v=2"></script>

</body>
</html>
