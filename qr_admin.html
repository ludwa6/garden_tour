<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Admin</title>

  <link rel="stylesheet" href="style.css?v=2">
  <script>
    (function() {
      var dir = location.pathname.replace(/[^/]*$/, '');
      window.appBase = dir.endsWith('/poi/') ? dir.slice(0, -4) : dir;
      var base = document.createElement('base');
      base.href = window.appBase;
      document.head.appendChild(base);
    })();
  </script>
</head>
<body class="qr-admin-page">
  <div class="appbar">
    <h1>QR Admin</h1>
    <a href="index.html" class="back-btn">← Back to main</a>
  </div>

  <main id="qr-admin-content">
    <!-- Controls -->
    <div class="controls">
      <label for="observationSelect">Select Observation:</label>
      <select id="observationSelect">
        <option value="">Loading...</option>
      </select>
    </div>

    <!-- QR code preview -->
    <div id="qr-preview">
      <h3>Custom QR Code:</h3>
      <canvas id="qrCanvas"></canvas>
    </div>
    
    <!-- Observation preview -->
    <div id="observationPreview" class="preview"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <!-- Again: relative path, no leading slash -->
  <script src="escape.js"></script>
  <script src="qr_admin.js"></script>

  <footer id="site-footer"></footer>

  <script>
    fetch(window.appBase + 'footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('site-footer').innerHTML = html;
        document.querySelectorAll('#site-footer .nav-link').forEach(link => {
          link.href = window.appBase + link.dataset.target;
        });
      })
      .catch(err => console.error('Failed to load footer:', err));
  </script>
</body>
</html>
